<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690"><defs><marker id="arrow" orient="auto" markerWidth="9" markerHeight="9" refX="7" refY="4.5"><path d="M0 0L9 4.5L0 9Z" fill="#007773"/></marker></defs><rect width="1100" height="690" fill="#f0f6f8"/><rect width="1100" height="96" fill="#163b4a"/><text x="30" y="40" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="white">Severe bleeding • direct pressure</text><text x="30" y="73" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#cde5eb">Concept drawing • no simulated blood or injury</text><rect x="120" y="330" width="860" height="150" rx="70" fill="#e9b68e" stroke="#80583f" stroke-width="3"/><rect x="455" y="316" width="190" height="176" rx="12" fill="#ffffff" stroke="#b5c9d2" stroke-width="3"/><path d="M475 341H625M475 370H625M475 399H625M475 428H625M475 457H625" stroke="#d5dfe3" stroke-width="3"/><path d="M550 157L550 300" stroke="#007773" stroke-width="6" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><rect x="665" y="190" width="375" height="88" rx="18" fill="#ffffff" stroke="#c5d8df" stroke-width="3"/><rect x="665" y="190" width="8" height="88" rx="4" fill="#007773" stroke="none" stroke-width="3"/><text x="685" y="225" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#163b4a">Firm, continuous pressure</text><text x="685" y="259" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#163b4a">Directly over the wound</text><path d="M645 390L740 390" stroke="#007773" stroke-width="4" stroke-linecap="round" fill="none"/><rect x="747" y="351" width="305" height="86" rx="18" fill="#ffffff" stroke="#c5d8df" stroke-width="3"/><rect x="747" y="351" width="8" height="86" rx="4" fill="#007773" stroke="none" stroke-width="3"/><text x="767" y="386" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#163b4a">Clean dressing</text><text x="767" y="420" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#163b4a">or available cloth</text><text x="550" y="554" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#163b4a">Keep pressure on while help is arranged.</text><rect y="630" width="1100" height="60" fill="#fff0d5"/><text x="550" y="668" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#754b08">DRAFT • EXPERT REVIEW ONLY • NOT FOR EMERGENCY USE</text></svg>