<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" width="1100" height="690"><defs><marker id="arrow" orient="auto" markerWidth="8" markerHeight="8" refX="6" refY="4"><path d="M0 0L8 4L0 8Z" fill="#007773"/></marker></defs><rect width="1100" height="690" fill="#f0f6f8"/><rect width="1100" height="100" fill="#163b4a"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="white" text-anchor="start">Seizure • protect and time</text><text x="30" y="76" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#cde5eb" text-anchor="start">Stay with the person; do not restrain</text><rect x="35.0" y="132" width="331.3333333333333" height="437" rx="18" fill="white" stroke="#c5d8df" stroke-width="3"/><circle cx="200.66666666666666" cy="280" r="104" fill="#e9f3f5" stroke="none" stroke-width="3"/><g transform="translate(200.66666666666666 280)"><path d="M-71 -46Q-42 -69 0 -48Q42 -69 71 -46Q51 0 71 46Q42 69 0 48Q-42 69 -71 46Q-51 0 -71 -46Z" stroke="#235e85" stroke-width="5" fill="#a9cddf" stroke-linecap="round" stroke-linejoin="round" /><path d="M-44 -28Q0 -13 44 -28" stroke="#235e85" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><text x="200.66666666666666" y="425" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="750" fill="#163b4a" text-anchor="middle">Protect the head</text><text x="200.66666666666666" y="466" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">Clear nearby hazards</text><rect x="384.3333333333333" y="132" width="331.3333333333333" height="437" rx="18" fill="white" stroke="#c5d8df" stroke-width="3"/><circle cx="550.0" cy="280" r="104" fill="#e9f3f5" stroke="none" stroke-width="3"/><g transform="translate(550.0 280)"><circle cx="0" cy="0" r="74" fill="white" stroke="#235e85" stroke-width="7"/><path d="M0 -45V0L34 22" stroke="#235e85" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="0" cy="0" r="7" fill="#235e85" stroke="none" stroke-width="3"/><path d="M-23 -85H23" stroke="#235e85" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><text x="550.0" y="425" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="750" fill="#163b4a" text-anchor="middle">Time the seizure</text><text x="550.0" y="466" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">Call 911 if over</text><text x="550.0" y="496" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">5 minutes or sooner</text><text x="550.0" y="526" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">for warning signs</text><rect x="733.6666666666666" y="132" width="331.3333333333333" height="437" rx="18" fill="white" stroke="#c5d8df" stroke-width="3"/><circle cx="899.3333333333333" cy="280" r="104" fill="#e9f3f5" stroke="none" stroke-width="3"/><g transform="translate(899.3333333333333 280)"><circle cx="0" cy="0" r="67" fill="#fff7f5" stroke="#a21e29" stroke-width="8"/><path d="M-46 -46L46 46" stroke="#a21e29" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><text x="899.3333333333333" y="425" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="750" fill="#163b4a" text-anchor="middle">Nothing in mouth</text><text x="899.3333333333333" y="466" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">Do not hold down</text><text x="550" y="604" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="650" fill="#163b4a" text-anchor="middle">Call 911 for a first seizure, breathing trouble or other emergency signs.</text><rect y="630" width="1100" height="60" fill="#fff0d5"/><text x="550" y="667" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#754b08" text-anchor="middle">DRAFT • EXPERT REVIEW ONLY • NOT FOR EMERGENCY USE</text></svg>