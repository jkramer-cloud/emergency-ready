<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690"><defs><marker id="arrow" orient="auto" markerWidth="9" markerHeight="9" refX="7" refY="4.5"><path d="M0 0L9 4.5L0 9Z" fill="#007773"/></marker></defs><rect width="1100" height="690" fill="#f0f6f8"/><rect width="1100" height="96" fill="#163b4a"/><text x="30" y="40" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="white">Recovery position • decision reminder</text><text x="30" y="73" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#cde5eb">Decision graphic • physical positioning not yet illustrated</text><rect x="140" y="116" width="820" height="85" rx="18" fill="#ffffff" stroke="#c5d8df" stroke-width="3"/><rect x="140" y="116" width="8" height="85" rx="4" fill="#007773" stroke="none" stroke-width="3"/><text x="160" y="151" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#163b4a">Unresponsive but breathing normally?</text><path d="M550 204L550 230" stroke="#007773" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M295 230L805 230" stroke="#007773" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M295 230L295 250" stroke="#007773" stroke-width="6" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><path d="M805 230L805 250" stroke="#007773" stroke-width="6" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><rect x="65" y="260" width="460" height="150" rx="18" fill="#ffffff" stroke="#c5d8df" stroke-width="3"/><rect x="65" y="260" width="8" height="150" rx="4" fill="#007773" stroke="none" stroke-width="3"/><text x="85" y="295" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#163b4a">If safe to move</text><text x="85" y="329" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#163b4a">Side recovery position</text><text x="85" y="363" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#163b4a">Keep airway clear; monitor</text><rect x="575" y="260" width="460" height="150" rx="18" fill="#ffffff" stroke="#c5d8df" stroke-width="3"/><rect x="575" y="260" width="8" height="150" rx="4" fill="#b52a35" stroke="none" stroke-width="3"/><text x="595" y="295" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#163b4a">Suspected spinal injury</text><text x="595" y="329" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#163b4a">Or hip / pelvis injury</text><text x="595" y="363" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#163b4a">Avoid unnecessary movement</text><rect x="140" y="474" width="820" height="95" rx="18" fill="#ffffff" stroke="#c5d8df" stroke-width="3"/><rect x="140" y="474" width="8" height="95" rx="4" fill="#b52a35" stroke="none" stroke-width="3"/><text x="160" y="509" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#163b4a">If breathing is abnormal or only gasping: CPR / AED.</text><rect y="630" width="1100" height="60" fill="#fff0d5"/><text x="550" y="668" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#754b08">DRAFT • EXPERT REVIEW ONLY • NOT FOR EMERGENCY USE</text></svg>