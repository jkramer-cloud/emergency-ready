<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" width="1100" height="690"><defs><marker id="arrow" orient="auto" markerWidth="8" markerHeight="8" refX="6" refY="4"><path d="M0 0L8 4L0 8Z" fill="#007773"/></marker></defs><rect width="1100" height="690" fill="#f0f6f8"/><rect width="1100" height="100" fill="#163b4a"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="white" text-anchor="start">Hypothermia • protect from cold</text><text x="30" y="76" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#cde5eb" text-anchor="start">Prevent further heat loss and arrange help</text><rect x="35.0" y="132" width="331.3333333333333" height="437" rx="18" fill="white" stroke="#c5d8df" stroke-width="3"/><circle cx="200.66666666666666" cy="280" r="104" fill="#e9f3f5" stroke="none" stroke-width="3"/><g transform="translate(200.66666666666666 280)"><path d="M0 -78L73 -47V12Q72 65 0 92Q-73 65 -73 12V-47Z" stroke="#007773" stroke-width="5" fill="#e0f1ec" stroke-linecap="round" stroke-linejoin="round" /><path d="M-36 5L-11 31L37 -25" stroke="#007773" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><text x="200.66666666666666" y="425" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="750" fill="#163b4a" text-anchor="middle">Get to shelter</text><text x="200.66666666666666" y="466" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">Handle gently</text><rect x="384.3333333333333" y="132" width="331.3333333333333" height="437" rx="18" fill="white" stroke="#c5d8df" stroke-width="3"/><circle cx="550.0" cy="280" r="104" fill="#e9f3f5" stroke="none" stroke-width="3"/><g transform="translate(550.0 280)"><rect x="-80" y="-65" width="160" height="130" rx="12" fill="#e4b76a" stroke="#8d622a" stroke-width="5"/><path d="M-60 -48L60 -48M-60 -12L60 -12M-60 25L60 25M-60 48L60 48" stroke="#a67739" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M-35 -63V63M25 -63V63" stroke="#a67739" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><text x="550.0" y="425" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="750" fill="#163b4a" text-anchor="middle">Dry insulation</text><text x="550.0" y="466" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">Remove wet clothing</text><text x="550.0" y="496" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">when safe</text><rect x="733.6666666666666" y="132" width="331.3333333333333" height="437" rx="18" fill="white" stroke="#c5d8df" stroke-width="3"/><circle cx="899.3333333333333" cy="280" r="104" fill="#e9f3f5" stroke="none" stroke-width="3"/><g transform="translate(899.3333333333333 280)"><rect x="-15" y="-77" width="30" height="118" rx="12" fill="white" stroke="#235e85" stroke-width="5"/><circle cx="0" cy="55" r="33" fill="#9bd2e7" stroke="#235e85" stroke-width="5"/><path d="M0 -48V55" stroke="#235e85" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M20 -49H40M20 -21H40M20 7H40" stroke="#235e85" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><text x="899.3333333333333" y="425" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="750" fill="#163b4a" text-anchor="middle">Warm the core</text><text x="899.3333333333333" y="466" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">Avoid direct high heat</text><text x="899.3333333333333" y="496" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">or rubbing limbs</text><text x="550" y="604" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="650" fill="#163b4a" text-anchor="middle">Seek emergency help for suspected severe hypothermia.</text><rect y="630" width="1100" height="60" fill="#fff0d5"/><text x="550" y="667" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#754b08" text-anchor="middle">DRAFT • EXPERT REVIEW ONLY • NOT FOR EMERGENCY USE</text></svg>