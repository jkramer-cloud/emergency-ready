<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" width="1100" height="690"><defs><marker id="arrow" orient="auto" markerWidth="8" markerHeight="8" refX="6" refY="4"><path d="M0 0L8 4L0 8Z" fill="#007773"/></marker></defs><rect width="1100" height="690" fill="#f0f6f8"/><rect width="1100" height="100" fill="#163b4a"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="white" text-anchor="start">Heatstroke • cool immediately</text><text x="30" y="76" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#cde5eb" text-anchor="start">Confusion or collapse in heat is an emergency</text><rect x="35.0" y="132" width="331.3333333333333" height="437" rx="18" fill="white" stroke="#c5d8df" stroke-width="3"/><circle cx="200.66666666666666" cy="280" r="104" fill="#e9f3f5" stroke="none" stroke-width="3"/><g transform="translate(200.66666666666666 280)"><rect x="-46" y="-78" width="92" height="156" rx="16" fill="#163b4a" stroke="#163b4a" stroke-width="3"/><rect x="-35" y="-62" width="70" height="116" rx="8" fill="#d8e9ef" stroke="none" stroke-width="3"/><text x="0" y="9" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="800" fill="#a21e29" text-anchor="middle">911</text><circle cx="0" cy="65" r="6" fill="white" stroke="none" stroke-width="3"/></g><text x="200.66666666666666" y="425" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="750" fill="#163b4a" text-anchor="middle">Call 911</text><text x="200.66666666666666" y="466" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">Do not wait</text><rect x="384.3333333333333" y="132" width="331.3333333333333" height="437" rx="18" fill="white" stroke="#c5d8df" stroke-width="3"/><circle cx="550.0" cy="280" r="104" fill="#e9f3f5" stroke="none" stroke-width="3"/><g transform="translate(550.0 280)"><path d="M0 -82C-17 -54 -64 -6 -64 26A64 64 0 0 0 64 26C64 -6 17 -54 0 -82Z" stroke="#235e85" stroke-width="5" fill="#9cd2e7" stroke-linecap="round" stroke-linejoin="round" /><path d="M-39 29Q-35 52 -12 58" stroke="white" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><text x="550.0" y="425" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="750" fill="#163b4a" text-anchor="middle">Rapid cooling</text><text x="550.0" y="466" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">Cold-water immersion</text><text x="550.0" y="496" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">when safe and feasible</text><rect x="733.6666666666666" y="132" width="331.3333333333333" height="437" rx="18" fill="white" stroke="#c5d8df" stroke-width="3"/><circle cx="899.3333333333333" cy="280" r="104" fill="#e9f3f5" stroke="none" stroke-width="3"/><g transform="translate(899.3333333333333 280)"><circle cx="0" cy="0" r="78" fill="white" stroke="#235e85" stroke-width="5"/><circle cx="0" cy="0" r="13" fill="#235e85" stroke="none" stroke-width="3"/><g transform="rotate(0)"><path d="M0 -14Q-64 -82 -66 -34Q-63 -4 -11 3Z" stroke="#235e85" stroke-width="3" fill="#9cd2e7" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="rotate(120)"><path d="M0 -14Q-64 -82 -66 -34Q-63 -4 -11 3Z" stroke="#235e85" stroke-width="3" fill="#9cd2e7" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="rotate(240)"><path d="M0 -14Q-64 -82 -66 -34Q-63 -4 -11 3Z" stroke="#235e85" stroke-width="3" fill="#9cd2e7" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M0 78V101H49M0 101H-49" stroke="#235e85" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><text x="899.3333333333333" y="425" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="750" fill="#163b4a" text-anchor="middle">Other cooling</text><text x="899.3333333333333" y="466" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">Wet skin and fan</text><text x="899.3333333333333" y="496" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">if immersion unavailable</text><text x="550" y="604" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="650" fill="#163b4a" text-anchor="middle">Keep the airway protected; do not force drinks on a confused person.</text><rect y="630" width="1100" height="60" fill="#fff0d5"/><text x="550" y="667" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#754b08" text-anchor="middle">DRAFT • EXPERT REVIEW ONLY • NOT FOR EMERGENCY USE</text></svg>