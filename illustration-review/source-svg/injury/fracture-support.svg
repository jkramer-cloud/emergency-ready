<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" width="1100" height="690"><defs><marker id="arrow" orient="auto" markerWidth="8" markerHeight="8" refX="6" refY="4"><path d="M0 0L8 4L0 8Z" fill="#007773"/></marker></defs><rect width="1100" height="690" fill="#f0f6f8"/><rect width="1100" height="100" fill="#163b4a"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="white" text-anchor="start">Fracture • support and protect</text><text x="30" y="76" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#cde5eb" text-anchor="start">An injured limb may need professional care</text><rect x="35.0" y="132" width="331.3333333333333" height="437" rx="18" fill="white" stroke="#c5d8df" stroke-width="3"/><circle cx="200.66666666666666" cy="280" r="104" fill="#e9f3f5" stroke="none" stroke-width="3"/><g transform="translate(200.66666666666666 280)"><path d="M-85 -23Q-42 -28 -10 -15L65 -6Q90 2 75 21L-13 37Q-35 32 -85 24Z" stroke="#80583f" stroke-width="4" fill="#e9b68e" stroke-linecap="round" stroke-linejoin="round" /><rect x="-66" y="38" width="125" height="28" rx="10" fill="#a9cddf" stroke="#235e85" stroke-width="4"/></g><text x="200.66666666666666" y="425" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="750" fill="#163b4a" text-anchor="middle">Support the limb</text><text x="200.66666666666666" y="466" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">Keep in position</text><text x="200.66666666666666" y="496" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">found</text><rect x="384.3333333333333" y="132" width="331.3333333333333" height="437" rx="18" fill="white" stroke="#c5d8df" stroke-width="3"/><circle cx="550.0" cy="280" r="104" fill="#e9f3f5" stroke="none" stroke-width="3"/><g transform="translate(550.0 280)"><circle cx="0" cy="0" r="67" fill="#fff7f5" stroke="#a21