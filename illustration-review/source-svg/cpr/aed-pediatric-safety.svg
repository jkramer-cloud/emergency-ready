rect x="-77" y="-64" width="65" height="99" rx="12" fill="#d9edf3" stroke="#235e85" stroke-width="4"/><rect x="12" y="-33" width="65" height="99" rx="12" fill="#d9edf3" stroke="#235e85" stroke-width="4"/><path d="M-44 -65V-84M45 -34V-54" stroke="#235e85" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="-44" y="-6" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#235e85" text-anchor="middle">1</text><text x="45" y="27" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#235e85" text-anchor="middle">2</text></g><text x="550.0" y="425" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="750" fill="#163b4a" text-anchor="middle">Child pads if available</text><text x="550.0" y="466" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">Use device instructions</text><rect x="733.6666666666666" y="132" width="331.3333333333333" height="437" rx="18" fill="white" stroke="#c5d8df" stroke-width="3"/><circle cx="899.3333333333333" cy="280" r="104" fill="#e9f3f5" stroke="none" stroke-width="3"/><g transform="translate(899.3333333333333 280)"><circle cx="0" cy="0" r="67" fill="#fff7f5" stroke="#a21e29" stroke-width="8"/><path d="M-46 -46L46 46" stroke="#a21e29" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><text x="899.3333333333333" y="425" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="750" fill="#163b4a" text-anchor="middle">Do not overlap pads</text><text x="899.3333333333333" y="466" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">Use front/back if</text><text x="899.3333333333333" y="496" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#163b4a" text-anchor="middle">needed to avoid contact</text><text x="550" y="604" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="650" fill="#163b4a" text-anchor="middle">Do not delay defibrillation while searching for pediatric pads.</text><rect y="630" width="1100" height="60" fill="#fff0d5"/><text x="550" y="667" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#754b08" text-anchor="middle">DRAFT • EXPERT REVIEW ONLY • NOT FOR EMERGENCY USE</text></svg>