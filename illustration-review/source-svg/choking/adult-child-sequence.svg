<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690"><defs><marker id="arrow" orient="auto" markerWidth="9" markerHeight="9" refX="7" refY="4.5"><path d="M0 0L9 4.5L0 9Z" fill="#007773"/></marker></defs><rect width="1100" height="690" fill="#f0f6f8"/><rect width="1100" height="96" fill="#163b4a"/><text x="30" y="40" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="white">Severe choking • adult or child</text><text x="30" y="73" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#cde5eb">Sequence overview • not a technique demonstration</text><rect x="30" y="116" width="1040" height="78" rx="18" fill="#ffffff" stroke="#c5d8df" stroke-width="3"/><rect x="30" y="116" width="8" height="78" rx="4" fill="#007773" stroke="none" stroke-width="3"/><text x="50" y="151" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#163b4a">Activate emergency help • severe choking; do not delay</text><rect x="90" y="226" width="370" height="240" rx="18" fill="#fff" stroke="#c3d6dc" stroke-width="3"/><rect x="640" y="226" width="370" height="240" rx="18" fill="#fff" stroke="#c3d6dc" stroke-width="3"/><circle cx="275" cy="312" r="65" fill="#007773" stroke="none" stroke-width="3"/><circle cx="825" cy="312" r="65" fill="#235e85" stroke="none" stroke-width="3"/><text x="275" y="333" font-family="DejaVu Sans,sans-serif" font-size="74" font-weight="700" text-anchor="middle" fill="white">5</text><text x="825" y="333" font-family="DejaVu Sans,sans-serif" font-size="74" font-weight="700" text-anchor="middle" fill="white">5</text><text x="275" y="414" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#163b4a">Back blows</text><text x="825" y="414" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#163b4a">Abdominal thrusts</text><path d="M481 330L615 330" stroke="#007773" stroke-width="6" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><text x="550" y="511" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="600" text-anchor="middle" fill="#163b4a">Alternate until obstruction clears or person becomes unresponsive.</text><text x="550" y="556" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#b52a35">If unresponsive, begin CPR and follow dispatcher guidance.</text><text x="550" y="601" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="#163b4a">Use chest thrusts instead in late pregnancy or if unable to encircle abdomen.</text><rect y="630" width="1100" height="60" fill="#fff0d5"/><text x="550" y="668" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#754b08">DRAFT • EXPERT REVIEW ONLY • NOT FOR EMERGENCY USE</text></svg>